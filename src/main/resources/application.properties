# Change these credentials to match your local MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/warranty_vault?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

spring.cache.type=simple
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
vault.upload-dir=./uploads
vault.export-dir=./exports
vault.scheduler.cron=0 0 9 * * *

spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.queues=warranty.reminders,claim.updates
