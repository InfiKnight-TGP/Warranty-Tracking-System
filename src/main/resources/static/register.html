<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Create account · Warrify</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand"><img class="brand-logo" src="images/warrify-mark.svg" alt=""> Warrify</div>
      <p class="eyebrow">Get organized</p>
      <h1>Create your account</h1>
      <p class="subtitle mb-4">Start keeping your bills, serial numbers, and warranties together.</p>
      <div id="message" class="alert" hidden></div>
      <form id="register-form">
        <label class="form-label">Full name</label>
        <input class="form-control mb-3" name="name" maxlength="120" required>
        <label class="form-label">Email</label>
        <input class="form-control mb-3" name="email" type="email" required>
        <label class="form-label">Phone (optional)</label>
        <input class="form-control mb-3" name="phone" type="tel">
        <label class="form-label">Password</label>
        <input class="form-control mb-4" name="password" type="password" minlength="6" autocomplete="new-password" required>
        <button class="btn btn-primary w-100">Create account</button>
      </form>
      <p class="auth-footer">Already registered? <a href="login.html">Sign in</a></p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
